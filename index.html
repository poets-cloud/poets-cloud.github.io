<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诗云 Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar floating-surface">
        <div>
          <p class="eyebrow">Poets Cloud Demo</p>
          <h1>诗云</h1>
          <p class="subtitle">在朝代、诗人与诗作之间漫游</p>
        </div>
        <div class="stats" id="stats"></div>
      </header>

      <section class="controls floating-window filters-collapsed" id="controlPanel">
        <div class="window-bar">
          <div class="window-title">
            <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>宇宙探索器</span>
          </div>
          <button id="toggleFilters" class="window-action" type="button" aria-expanded="false">展开筛选</button>
        </div>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="搜索标题、作者、正文或标签" />
          <button id="resetView" type="button">重置</button>
        </div>
        <div class="filters" id="meterFilters"></div>
      </section>

      <main class="layout">
        <section class="cloud">
          <canvas id="cloudCanvas2d"></canvas>
          <canvas id="cloudCanvas3d" aria-label="诗词宇宙：单指拖动移动镜头，双指捏合缩放"></canvas>
          <nav id="levelNav" class="level-nav" aria-label="诗词宇宙层级">
            <button id="levelBack" class="level-back" type="button" aria-label="返回上一级" title="返回上一级" disabled>←</button>
            <button type="button" data-level="overview" class="active">诗词宇宙</button>
            <span>›</span>
            <button type="button" data-level="dynasty" disabled>选择朝代</button>
            <span>›</span>
            <button type="button" data-level="author" disabled>选择诗人</button>
          </nav>
          <div class="level-summary">
            <strong id="levelTitle">朝代星系</strong>
            <span id="levelDescription">选择一个朝代进入；诗人和诗作将在下一层出现</span>
          </div>
          <div id="cloudLabels" class="cloud-labels" aria-hidden="true"></div>
          <div id="cloudTooltip" class="cloud-tooltip" role="status" aria-live="polite"></div>
          <div class="cloud-legend" aria-label="星云层级图例">
            <span><i class="legend-dot dynasty-dot"></i>朝代</span>
            <span><i class="legend-dot author-dot"></i>诗人</span>
            <span><i class="legend-dot poem-dot"></i>诗词</span>
          </div>
          <div class="cloud-hint">
            <span class="desktop-gesture-hint">左键拖拽旋转 · 右键 / 中键 / Shift + 左键拖拽平移 · 滚轮缩放</span>
            <span class="mobile-gesture-hint">单指拖移 · 双指捏合缩放</span>
          </div>
          <div id="debugOverlay" class="debug-overlay">星系正在苏醒...</div>
        </section>

        <button id="toggleMobileIndex" class="mobile-index-toggle" type="button" aria-controls="poemIndexPanel" aria-expanded="false">
          <span>星图索引</span>
          <strong id="mobileIndexCount">0</strong>
        </button>

        <aside class="sidebar" aria-label="诗词信息浮窗">
          <section class="floating-window list-panel" id="poemIndexPanel">
            <div class="window-bar compact">
              <div class="window-title">
                <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                <span>星图索引</span>
              </div>
              <button id="closeMobileIndex" class="mobile-index-close" type="button" aria-label="收起诗词索引">收起</button>
            </div>
            <div class="panel-head">
              <h2>结果列表</h2>
              <span id="resultCount"></span>
            </div>
            <div id="results" class="result-list"></div>
          </section>
        </aside>
      </main>

      <section id="poemReader" class="poem-reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle" aria-hidden="true">
        <button class="poem-reader-backdrop" type="button" data-reader-close aria-label="关闭诗词阅读"></button>
        <article class="poem-reader-card floating-window" tabindex="-1">
          <header class="reader-window-bar">
            <div class="window-title">
              <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span>诗作观测</span>
            </div>
            <div class="reader-window-actions">
              <button id="locatePoem" class="reader-utility" type="button">在星图中定位</button>
              <button id="toggleReadingMode" class="reader-utility" type="button" aria-pressed="false">展开阅读</button>
              <button class="reader-close" type="button" data-reader-close aria-label="关闭">×</button>
            </div>
          </header>

          <div class="reader-scroll">
            <div class="reader-kicker" id="readerMeta"></div>
            <h2 id="readerTitle" class="reader-title">诗词标题</h2>
            <div id="readerAuthor" class="reader-author"></div>
            <div id="readerBody" class="reader-body"></div>
            <div id="readerTags" class="reader-tags"></div>
          </div>

          <footer class="reader-footer">
            <button id="previousPoem" class="reader-nav" type="button" aria-label="上一首诗">
              <span>←</span><small>上一首</small>
            </button>
            <div id="readerPosition" class="reader-position"></div>
            <button id="nextPoem" class="reader-nav" type="button" aria-label="下一首诗">
              <small>下一首</small><span>→</span>
            </button>
          </footer>
        </article>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
